<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OWASP Guardian | Login</title>

    <link rel="stylesheet" href="css/login.css">

    <script defer src="js/login.js"></script>
</head>

<body>

<div class="container">

    <div class="login-card">

        <h1>🛡️ OWASP Guardian</h1>

        <p class="subtitle">
            Learn • Detect • Defend
        </p>

        <form id="loginForm">

            <input
                type="text"
                id="username"
                placeholder="Username"
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
            >

            <div class="remember">

                <input
                    type="checkbox"
                    id="remember"
                >

                <label for="remember">
                    Remember Me
                </label>

            </div>

            <button id="loginBtn">
                Login
            </button>

        </form>

        <p class="signup">

            Don't have an account?

            <a href="signup.html">

                Sign Up

            </a>

        </p>

    </div>

</div>

</body>
</html>
